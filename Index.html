<div id="registerOverlay" class="overlay"><div class="card"><div class="cardLogo">💬</div><h2>Elige tu nombre</h2><p>Se guardará solo en este dispositivo. La próxima vez entrarás automáticamente.</p><input id="registerName" class="registerInput" maxlength="30" autocomplete="off" placeholder="Tu nombre"><button id="registerButton" class="registerButton">Entrar</button><div class="small">No necesitas correo ni contraseña.</div></div></div>

<script type="module">

const $=id=>document.getElementById(id),registerOverlay=$("registerOverlay"),registerName=$("registerName"),registerButton=$("registerButton"),avatar=$("avatar"),currentUser=$("currentUser"),usersElement=$("users"),statusText=$("statusText"),statusDot=$("statusDot"),messagesElement=$("messages"),messageInput=$("message"),sendButton=$("send"),attachButton=$("attach"),fileInput=$("fileInput"),preview=$("preview"),previewMedia=$("previewMedia"),previewName=$("previewName"),previewSize=$("previewSize"),cancelFile=$("cancelFile");

const DB_NAME="global-chat-robust-db-v1",DB_VERSION=1,STORE="messages",FALLBACK_KEY="global-chat-fallback-records-v1";function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE)){const store=db.createObjectStore(STORE,{keyPath:"id"});store.createIndex("timestamp","timestamp")}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error("IndexedDB bloqueado"))})}function fallbackGet(){try{const raw=localStorage.getItem(FALLBACK_KEY);return raw?JSON.parse(raw):[]}catch{return[]}}function fallbackSave(record){try{const arr=fallbackGet().filter(x=>x.id!==record.id),portable={...record};delete portable.blob;arr.push(portable);arr.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));localStorage.setItem(FALLBACK_KEY,JSON.stringify(arr.slice(-MAX_MESSAGES)))}catch{}}async function getAllRecords(){if(dbBroken)return fallbackGet();try{const db=await openDB();const records=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});db.close();records.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));return records}catch(error){console.warn("IndexedDB falló, usando fallback:",error);dbBroken=true;return fallbackGet()}}async function saveRecord(record){const clean=sanitizeRecord(record);if(!clean)return;if(dbBroken){fallbackSave(clean);return}try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(clean);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();await trimRecords()}catch(error){console.warn("Guardado IndexedDB falló:",error);dbBroken=true;fallbackSave(clean)}}async function trimRecords(){const records=await getAllRecords();if(records.length<=MAX_MESSAGES)return;if(dbBroken)return;const function clearEmpty(){const empty=messagesElement.querySelector(".empty");if(empty)empty.remove()}function renderRecord(record,mine=false){const clean=sanitizeRecord(record);if(!clean)return;if(document.querySelector(`[data-message-id="${CSS.escape(clean.id)}"]`))return;clearEmpty();const row=document.createElement("div");row.className="row";if(mine)row.classList.add("mine");row.dataset.messageId=clean.id;const bubble=document.createElement("div");bubble.className="bubble";const meta=document.createElement("div");meta.className="meta";const name=document.createElement("span");name.className="name";name.textContent=clean.username;const time=document.createElement("span");time.className="time";time.textContent=formatTime(clean.timestamp);meta.append(name,time);bubble.appendChild(meta);if(clean.type==="text"){const text=document.createElement("div");text.className="text";text.textContent=clean.text;bubble.appendChild(text)}if(clean.type==="image"){if(clean.blob){const url=URL.createObjectURL(clean.blob);objectUrls.add(url);const img=document.createElement("img");img.className="media";img.loading="lazy";img.src=url;bubble.appendChild(img)}const label=document.createElement("div");label.className="fileName";label.textContent=clean.filename||"Imagen";bubble.appendChild(label)}if(clean.type==="video"){if(clean.blob){const url=URL.createObjectURL(clean.blob);objectUrls.add(url);const video=document.createElement("video");video.className="media";video.controls=true;video.preload="metadata";video.src=url;bubble.appendChild(video)}const label=document.createElement("div");label.className="fileName";label.textContent=clean.filename||"Video";bubble.appendChild(label)}row.appendChild(bubble);messagesElement.appendChild(row);scrollBottom()}async function addRecord(record,mine=false){const clean=sanitizeRecord(record);if(!clean)return;if(knownIds.has(clean.id))return;knownIds.add(clean.id);await saveRecord(clean);renderRecord(clean,mine)}async function loadHistory(){messagesElement.innerHTML="";knownIds.clear();const history=await getHistory();if(!history.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Todavía no hay mensajes";messagesElement.appendChild(empty);return}for(const record of history){const clean=sanitizeRecord(record);if(!clean)continue;knownIds.add(clean.id);renderRecord(clean,clean.username===myName)}}
function showRegister(){registerName.value=safeName(myName);registerOverlay.classList.add("show");setTimeout(()=>registerName.focus(),120)}function hideRegister(){registerOverlay.classList.remove("show")}async function registerUser(){const value=safeName(registerName.value);if(!value){alert("Escribe un nombre válido.");return}myName=value;localStorage.setItem(NAME_KEY,myName);setUIName();hideRegister();await loadHistory();startP2P();messageInput.focus()}
function clearFile(){selectedFile=null;fileInput.value="";preview.classList.remove("show");previewMedia.innerHTML=""}function showPreview(file){previewMedia.innerHTML="";previewName.textContent=file.name;previewSize.textContent=formatSize(file.size);const url=URL.createObjectURL(file);objectUrls.add(url);if(file.type.startsWith("image/")){const img=document.createElement("img");img.src=url;previewMedia.appendChild(img)}else{const video=document.createElement("video");video.src=url;video.muted=true;video.playsInline=true;previewMedia.appendChild(video)}preview.classList.add("show")}
function resetP2P(){try{room?.leave()}catch{}room=null;chatAction=null;nameAction=null;historyAction=null;fileAction=null;peerNames.clear();updateUsers()}function portableHistory(records){return records.map(record=>{const clean=sanitizeRecord(record);if(!clean)return null;return{id:clean.id,type:clean.type,username:clean.username,text:clean.text||"",filename:clean.filename||"",mime:clean.mime||"",size:clean.size||0,timestamp:clean.timestamp}}).filter(Boolean)}async function sendHistoryTo(peerId){if(!historyAction)return;try{const history=await getHistory();await historyAction.send(portableHistory(history),{target:peerId})}catch{}}async function broadcastHistory(){if(!historyAction||!room||peerCount()===0)return;try{const history=await getHistory();await historyAction.send(portableHistory(history))}catch{}}function startP2P(){if(!safeName(myName)||room)return;setStatus("En línea",false);try{room=joinRoom({appId:APP_ID,relayConfig:{urls:RELAYS,warnOnRelayFailure:false}},GLOBAL_ROOM);chatAction=room.makeAction("chat");nameAction=room.makeAction("name");historyAction=room.makeAction("history");fileAction=room.makeAction("file");chatAction.onMessage=async(data,{peerId})=>{const clean=sanitizeRecord({id:data?.id,type:"text",username:data?.username||peerNames.get(peerId)||"Usuario",text:data?.text||"",timestamp:data?.timestamp||now()});await addRecord(clean,false)};nameAction.onMessage=(name,{peerId})=>{const clean=safeName(name)||"Usuario";peerNames.set(peerId,clean)};historyAction.onMessage=async data=>{if(!Array.isArray(data))return;const sorted=data.map(sanitizeRecord).filter(Boolean).slice(-MAX_MESSAGES).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));for(const record of sorted)await addRecord(record,record.username===myName)};fileAction.onMessage=async(data,{peerId,metadata})=>{if(!metadata?.id||!metadata?.mediaType)return;if(!["image","video"].includes(metadata.mediaType))return;const blob=new Blob([data],{type:metadata.mime||"application/octet-stream"});if(metadata. sendButton.onclick=send;messageInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();send()}});attachButton.onclick=()=>{if(!safeName(myName)){showRegister();return}fileInput.click()};fileInput.onchange=()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;if(!file.type.startsWith("image/")&&!file.type.startsWith("video/")){alert("Selecciona una imagen o video.");fileInput.value="";return}if(file.type.startsWith("image/")&&file.size>MAX_IMAGE){alert("La imagen supera 10 MB.");fileInput.value="";return}if(file.type.startsWith("video/")&&file.size>MAX_VIDEO){alert("El video supera 50 MB.");fileInput.value="";return}selectedFile=file;showPreview(file)};cancelFile.onclick=clearFile;avatar.onclick=showRegister;registerButton.onclick=registerUser;registerName.addEventListener("keydown",event=>{if(event.key==="Enter")registerUser()});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&safeName(myName)){if(!room)startP2P();broadcastHistory()}});window.addEventListener("online",()=>{if(safeName(myName)&&!room)startP2P()});window.addEventListener("beforeunload",()=>{for(const url of objectUrls)URL.revokeObjectURL(url);clearInterval(reconnectTimer);clearInterval(syncTimer);try{room?.leave()}catch{}});
