function makeId(){

  return crypto.randomUUID
    ? crypto.randomUUID()
    : (
        Date.now()
        +
        "-"
        +
        Math.random()
        .toString(36)
        .slice(2)

}

function formatTime(timestamp){

    timestamp
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatSize(bytes){

  if(bytes < 1024){

    return bytes + " B";

  }

  if(bytes < 1024 * 1024){

    return (
      bytes / 1024
    ).toFixed(1)
    + " KB";

  }

  return (
    bytes / 1024 / 1024
  ).toFixed(1)
  + " MB";

}

// =====================================================
// INDEXED DB
// =====================================================

const DB_NAME =
"global-chat-professional";

const DB_VERSION =
1;

const STORE =
"messages";


function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


      request.onupgradeneeded =
      ()=>{

        const db =
        request.result;


        if(
          !db.objectStoreNames.contains(
            STORE
          )
        ){

          const store =
          db.createObjectStore(
            STORE,
            {
              keyPath:"id"
            }
          );


          store.createIndex(
            "timestamp",
            "timestamp"
          );

        }

      };


      request.onsuccess =
      ()=>resolve(
        request.result
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );

}


async function getAllRecords(){

  const db =
  await openDB();


  const records =
  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readonly"
      );


      const request =
      tx
      .objectStore(
        STORE
      )
      .getAll();


      request.onsuccess =
      ()=>resolve(
        request.result
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );


  db.close();


  records.sort(
    (a,b)=>
      a.timestamp
      -
      b.timestamp
  );


  return records;

}


async function getHistory(){

  const records =
  await getAllRecords();


  return records.slice(
    -MAX_MESSAGES
  );

}


async function saveRecord(record){

  const db =
  await openDB();


  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );


      tx.objectStore(
        STORE
      ).put(
        record
      );


      tx.oncomplete =
      resolve;


      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );


  db.close();


  await trimMessages();

}


async function trimMessages(){

  const records =
  await getAllRecords();


  if(
    records.length <= MAX_MESSAGES
  ){

    return;

  }


  const old =
  records.slice(
    0,
    records.length - MAX_MESSAGES
  );


  const db =
  await openDB();


  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );


      const store =
      tx.objectStore(
        STORE
      );


      old.forEach(
        record=>
          store.delete(
            record.id
          )
      );


      tx.oncomplete =
      resolve;


      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );


  db.close();

}


// =====================================================
// RENDER
// =====================================================

function renderMessage(
  record,
  mine = false
){

  if(
    document.querySelector(
      `[data-message-id="${record.id}"]`
    )
  ){

    return;

  }


  const row =
  document.createElement(
    "div"
  );


  row.className =
  "messageRow";


  if(mine){

    row.classList.add(
      "mine"
    );

  }


  row.dataset.messageId =
  record.id;


  const bubble =
  document.createElement(
    "div"
  );


  bubble.className =
  "bubble";


  const meta =
  document.createElement(
    "div"
  );


  meta.className =
  "messageMeta";


  const name =
  document.createElement(
    "span"
  );


  name.className =
  "messageName";


  name.textContent =
  record.username
  ||
  "Usuario";


  const time =
  document.createElement(
    "span"
  );


  time.className =
  "messageTime";


  time.textContent =
  formatTime(
    record.timestamp
  );


  meta.append(
    name,
    time
  );


  bubble.appendChild(
    meta
  );


  if(
    record.type === "text"
  ){

    const body =
    document.createElement(
      "div"
    );


    body.className =
    "messageText";


    body.textContent =
    record.text
    ||
    "";


    bubble.appendChild(
      body
    );

  }


  if(
    record.type === "image"
  ){

    if(record.blob){

      const img =
      document.createElement(
        "img"
      );


      img.className =
      "media";


      img.loading =
      "lazy";


      img.src =
      URL.createObjectURL(
        record.blob
      );


      bubble.appendChild(
        img
      );

    }


    const metaFile =
    document.createElement(
      "div"
    );


    metaFile.className =
    "fileMeta";


    metaFile.textContent =
    record.filename
    ||
    "Imagen";


    bubble.appendChild(
      metaFile
    );

  }


  if(
    record.type === "video"
  ){

    if(record.blob){

      const video =
      document.createElement(
        "video"
      );


      video.className =
      "media";


      video.controls =
      true;


      video.preload =
      "metadata";


      video.src =
      URL.createObjectURL(
        record.blob
      );


      bubble.appendChild(
        video
      );

    }


    const metaFile =
    document.createElement(
      "div"
    );


    metaFile.className =
    "fileMeta";


    metaFile.textContent =
    record.filename
    ||
    "Video";


    bubble.appendChild(
      metaFile
    );

  }


  row.appendChild(
    bubble
  );


  messagesElement.appendChild(
    row
  );


  scrollBottom();

}


async function addRecord(
  record,
  mine = false
){

  if(
    knownMessageIds.has(
      record.id
    )
  ){

    return;

  }


  knownMessageIds.add(
    record.id
  );


  await saveRecord(
    record
  );


  renderMessage(
    record,
    mine
  );

}


async function loadHistory(){

  await getHistory();


  for(

    knownMessageIds.add(

    renderMessage(

    );


    empty.className =
    "systemMessage";


    empty.textContent =
    "No hay mensajes todavía";


    messagesElement.appendChild(
      empty
    );

  }

}

<script type="module">

import {
  joinRoom
}
from "https://esm.run/trystero@0.25.3";


// ======================================================
// CONFIGURACIÓN
// ======================================================

const GLOBAL_ROOM =
"TYLERPRO09-GLOBAL-CHAT-V7";

const APP_ID =
"tylerpro09-global-chat-v7";

const NAME_KEY =
"global-chat-username";

const MAX_MESSAGES =
200;

const MAX_IMAGE =
10 * 1024 * 1024;

const MAX_VIDEO =
50 * 1024 * 1024;

const RELAYS = [
  "wss://relay.damus.io",
  "wss://relay.nostr.band",
  "wss://nos.lol",
  "wss://nostr.wine"
];


// ======================================================
// ELEMENTOS
// ======================================================

const registerOverlay =
document.getElementById("registerOverlay");

const registerName =
document.getElementById("registerName");

const registerButton =
document.getElementById("registerButton");

const changeNameButton =
document.getElementById("changeName");

const currentUser =
document.getElementById("currentUser");

const statusElement =
document.getElementById("status");

const usersElement =
document.getElementById("users");

const messagesElement =
document.getElementById("messages");

const messageInput =
document.getElementById("message");

const sendButton =
document.getElementById("send");

const attachButton =
document.getElementById("attach");

const fileInput =
document.getElementById("fileInput");

const preview =
document.getElementById("preview");

const previewMedia =
document.getElementById("previewMedia");

const previewName =
document.getElementById("previewName");

const previewSize =
document.getElementById("previewSize");

const cancelFile =
document.getElementById("cancelFile");


// ======================================================
// ESTADO
// ======================================================

let myName =
localStorage.getItem(NAME_KEY);

let room = null;

let chatAction = null;

let nameAction = null;

let historyAction = null;

let fileAction = null;

let selectedFile = null;

const peerNames =
new Map();

const knownMessageIds =
new Set();


// ======================================================
// HELPERS
// ======================================================

function makeId(){

  if(crypto.randomUUID){
    return crypto.randomUUID();
  }

  return (
    Date.now()
    +
    "-"
    +
    Math.random()
    .toString(36)
    .slice(2)
  );

}


function now(){

  return Date.now();

}


function formatTime(timestamp){

  return new Date(timestamp)
  .toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatSize(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (
      bytes / 1024
    ).toFixed(1)
    + " KB";
  }

  return (
    bytes / 1024 / 1024
  ).toFixed(1)
  + " MB";

}


// ======================================================
// INDEXEDDB
// ======================================================

const DB_NAME =
"global-p2p-chat-v7";

const DB_VERSION =
1;

const STORE =
"messages";


function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


      request.onupgradeneeded =
      ()=>{

        const db =
        request.result;

        if(
          !db.objectStoreNames.contains(
            STORE
          )
        ){

          const store =
          db.createObjectStore(
            STORE,
            {
              keyPath:"id"
            }
          );

          store.createIndex(
            "timestamp",
            "timestamp"
          );

        }

      };


      request.onsuccess =
      ()=>resolve(
        request.result
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );

}


async function saveRecord(record){

  const db =
  await openDB();


  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

      tx.objectStore(
        STORE
      ).put(
        record
      );

      tx.oncomplete =
      resolve;

      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );


  db.close();

  await trimDatabase();

}


async function getAllRecords(){

  const db =
  await openDB();


  const records =
  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readonly"
      );

      const request =
      tx.objectStore(
        STORE
      ).getAll();


      request.onsuccess =
      ()=>resolve(
        request.result
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );


  db.close();


  records.sort(
    (a,b)=>
      a.timestamp
      -
      b.timestamp
  );


  return records;

}


async function getHistory(){

  const records =
  await getAllRecords();

  return records.slice(
    -MAX_MESSAGES
  );

}


async function trimDatabase(){

  const records =
  await getAllRecords();


  if(
    records.length <= MAX_MESSAGES
  ){
    return;
  }


  const excess =
  records.slice(
    0,
    records.length - MAX_MESSAGES
  );


  const db =
  await openDB();


  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

      const store =
      tx.objectStore(
        STORE
      );


      for(
        const record
        of excess
      ){

        store.delete(
          record.id
        );

      }


      tx.oncomplete =
      resolve;

      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );


  db.close();

}


// ======================================================
// MENSAJES
// ======================================================

function systemMessage(text){

  const div =
  document.createElement("div");

  div.className =
  "system";

  div.textContent =
  text;

  messagesElement.appendChild(
    div
  );

  messagesElement.scrollTop =
  messagesElement.scrollHeight;

}


function renderRecord(
  record,
  mine = false
){

  if(
    document.querySelector(
      `[data-message-id="${record.id}"]`
    )
  ){
    return;
  }


  const box =
  document.createElement("div");

  box.className =
  "message";

  box.dataset.messageId =
  record.id;


  if(mine){
    box.classList.add(
      "mine"
    );
  }


  const name =
  document.createElement("div");

  name.className =
  "name";

  name.textContent =
  record.username
  ||
  "Usuario";


  const time =
  document.createElement("span");

  time.className =
  "time";

  time.textContent =
  formatTime(
    record.timestamp
  );


  name.appendChild(
    time
  );

  box.appendChild(
    name
  );


  if(
    record.type === "text"
  ){

    const body =
    document.createElement("div");

    body.textContent =
    record.text;

    box.appendChild(
      body
    );

  }


  if(
    record.type === "image"
  ){

    if(record.blob){

      const img =
      document.createElement("img");

      img.className =
      "media";

      img.src =
      URL.createObjectURL(
        record.blob
      );

      img.loading =
      "lazy";

      box.appendChild(
        img
      );

    }

    else{

      const body =
      document.createElement("div");

      body.textContent =
      "🖼️ "
      +
      (
        record.filename
        ||
        "Imagen"
      );

      box.appendChild(
        body
      );

    }

  }


  if(
    record.type === "video"
  ){

    if(record.blob){

      const video =
      document.createElement("video");

      video.className =
      "media";

      video.controls =
      true;

      video.preload =
      "metadata";

      video.src =
      URL.createObjectURL(
        record.blob
      );

      box.appendChild(
        video
      );

    }

    else{

      const body =
      document.createElement("div");

      body.textContent =
      "🎬 "
      +
      (
        record.filename
        ||
        "Video"
      );

      box.appendChild(
        body
      );

    }

  }


  messagesElement.appendChild(
    box
  );

  messagesElement.scrollTop =
  messagesElement.scrollHeight;

}


async function addRecord(
  record,
  mine = false
){

  if(
    knownMessageIds.has(
      record.id
    )
  ){
    return;
  }


  knownMessageIds.add(
    record.id
  );


  await saveRecord(
    record
  );


  renderRecord(
    record,
    mine
  );

}


// ======================================================
// CARGAR HISTORIAL
// ======================================================

async function loadLocalHistory(){

  const history =
  await getHistory();


  messagesElement.innerHTML =
  "";


  for(
    const record
    of history
  ){

    knownMessageIds.add(
      record.id
    );


    renderRecord(
      record,
      record.username === myName
    );

  }


  if(
    history.length === 0
  ){

    systemMessage(
      "Bienvenido al chat global."
    );

  }

}

// USUARIOS
// ======================================================

function updateUsers(){

  if(!room){

    usersElement.textContent =
    "👥 1 usuario";

    return;

  }


  const peerIds =
  Object.keys(
    room.getPeers()
  );


  const total =
  peerIds.length + 1;


  usersElement.textContent =
  "👥 "
  +
  total
  +
  " usuario"
  +
  (
    total === 1
    ? ""
    : "s"
  );

}

    alert(
      "Escribe un nombre."

    return;

  }


  myName =
  value;


  localStorage.setItem(

    myName
  );


  currentUser.textContent =
  "👤 "
  +
  myName;


  hideRegister();


  if(!room){

    await startChat();

  }

}

// PREVIEW

function clearSelectedFile(){

  null;

  fileInput.value =
  "";

  preview.classList.remove(
    "show"
  );

  previewMedia.innerHTML =
  "";

}


function showSelectedFile(file){

  previewMedia.innerHTML =
  "";


  previewName.textContent =
  file.name;


  previewSize.textContent =
  formatSize(
    file.size
  );


  const url =
  URL.createObjectURL(
    file
  );


  if(
    file.type.startsWith(
      "image/"
    )
  ){

    const img =
    document.createElement("img");

    img.src =
    url;

    previewMedia.appendChild(
      img
    );

  }

  else{

    const video =
    document.createElement("video");

    video.src =
    url;

    video.muted =
    true;

    video.playsInline =
    true;

    previewMedia.appendChild(
      video
    );

  }


  preview.classList.add(
    "show"
  );

}


// ======================================================
// INICIAR CHAT P2P
// ======================================================

async function startChat(){

  if(
    !myName
    ||
    room
  ){
    return;
  }


  statusElement.textContent =
  "Conectando...";


  room =
  joinRoom(
    {
      appId:
      APP_ID,

      relayConfig:{
        urls:
        RELAYS,

        warnOnRelayFailure:
        false
      }
    },

    GLOBAL_ROOM
  );


  chatAction =
  room.makeAction(
    "chat-v7"
  );


  nameAction =
  room.makeAction(
    "username-v7"
  );


  historyAction =
  room.makeAction(

  );


  fileAction =
  room.makeAction(

  );


// ======================================================

  chatAction.onMessage =

    data,

    if(

    ){

      timestamp:
      data.timestamp

      now()

    };


    await addRecord(

    );

  };


// ======================================================
// RECIBIR NOMBRE
// ======================================================

  nameAction.onMessage =
  (
    value,

      peerId
    }
  )=>{

    peerNames.set(
      peerId,
      String(value)
    );

  };


// ======================================================
// RECIBIR HISTORIAL
// ======================================================

  historyAction.onMessage =
  async data=>{

    if(
      !Array.isArray(data)
    ){
      return;
    }


    const history =
    data
    .slice(
      -MAX_MESSAGES
    )
    .sort(
      (a,b)=>
        a.timestamp
        -
        b.timestamp
    );


    for(
      const record
      of history
    ){

      if(
        !record.id
      ){
        continue;
      }


      await addRecord(

        record.username === myName
      );

    }

// RECIBIR ARCHIVO
// ======================================================

  fileAction.onMessage =
  async (
    data,
    {
      peerId,
      metadata
    }
  )=>{

    if(
      !metadata
      ||
      !metadata.id
    ){
      return;
    }


    const blob =
    new Blob(
      [data],
      {
        type:
        metadata.mime
      }
    );


    const record = {

      id:
      metadata.id,

      type:
      metadata.mediaType,

      username:
      metadata.username
      ||
      peerNames.get(peerId)
      ||
      "Usuario",

      timestamp:
      metadata.timestamp
      ||
      now(),

      filename:
      metadata.filename,

      mime:
      metadata.mime,

      size:
      blob.size,

      blob:
      blob

    };


    await addRecord(
      record,
      false
    );

  };


// ======================================================
// PEER ENTRA
// ======================================================

  room.onPeerJoin =
  async peerId=>{

    updateUsers();


    nameAction.send(
      myName,
      {
        target:
        peerId
      }
    );

    await getHistory();

function makeId(){

  if(crypto.randomUUID){
    return crypto.randomUUID();
  }

  return (
    Date.now()
    + "-"
    + Math.random()
      .toString(36)
      .slice(2)
  );

}


function now(){

}


function formatTime(timestamp){

  return new Date(timestamp)
  .toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatSize(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (
      bytes / 1024
    ).toFixed(1)
    + " KB";
  }

  return (
    bytes / 1024 / 1024
  ).toFixed(1)
  + " MB";

}


// ======================================================
// INDEXEDDB
// ======================================================

const DB_NAME =
"global-p2p-chat-v6";

const DB_VERSION =
1;

const STORE =
"messages";


function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


      request.onupgradeneeded =
      ()=>{

        const db =
        request.result;

        if(
          !db.objectStoreNames.contains(
            STORE
          )
        ){

          const store =
          db.createObjectStore(
            STORE,
            {
              keyPath:"id"
            }
          );

          store.createIndex(
            "timestamp",
            "timestamp"
          );

        }

      };


      request.onsuccess =
      ()=>resolve(
        request.result
      );


      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );

}


async function saveRecord(record){

  const db =
  await openDB();


  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

      tx.objectStore(
        STORE
      ).put(
        record
      );

      tx.oncomplete =
      resolve;

      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );


  db.close();

  await trimDatabase();

}


async function getAllRecords(){

  const db =
  await openDB();


  const records =
  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readonly"
      );

      const request =
      tx.objectStore(
        STORE
      ).getAll();

      request.onsuccess =
      ()=>resolve(
        request.result
      );

      request.onerror =
      ()=>reject(
        request.error
      );

    }
  );


  db.close();

  records.sort(
    (a,b)=>
      a.timestamp
      -
      b.timestamp
  );

  return records;

}


async function getHistory(){

  const records =
  await getAllRecords();

  return records.slice(
    -MAX_MESSAGES
  );

}


async function trimDatabase(){

  const records =
  await getAllRecords();

  if(
    records.length <= MAX_MESSAGES
  ){
    return;
  }


  const removeCount =
  records.length
  -
  MAX_MESSAGES;


  const toDelete =
  records.slice(
    0,
    removeCount
  );


  const db =
  await openDB();


  await new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

      const store =
      tx.objectStore(
        STORE
      );


      for(
        const record
        of toDelete
      ){

        store.delete(
          record.id
        );

      }


      tx.oncomplete =
      resolve;

      tx.onerror =
      ()=>reject(
        tx.error
      );

    }
  );


  db.close();

}

function renderRecord(

){

  if(

      `[data-message-id="${record.id}"]`
    )
  ){
    return;
  }


  const box =

  }

  "name";

  name.textContent =

  const time =

  time.className =
  "time";

  time.textContent =
  formatTime(
    record.timestamp
  );


  name.appendChild(
    time
  );

  box.appendChild(
    name
  );


  if(
    record.type === "text"
  ){

    const body =
    document.createElement("div");

    body.textContent =
    record.text;

    box.appendChild(
      body
    );

  }


  else if(
    record.type === "image"
  ){

    if(record.blob){

      const img =
      document.createElement("img");

      img.className =
      "media";

      img.loading =
      "lazy";

      img.src =
      URL.createObjectURL(
        record.blob
      );

      box.appendChild(

      );

    }

    else{

      const text =

        ||

      );

      box.appendChild(

      );

    }

  }


  else if(
    record.type === "video"
  ){

    if(record.blob){

      const video =
      document.createElement("video");

      video.className =
      "media";

      video.controls =
      true;

      video.preload =
      "metadata";

      video.src =
      URL.createObjectURL(
        record.blob
      );

      box.appendChild(
        video
      );

    }

    else{

      text.textContent =
      "🎬 "

        ||
        "Video"
      );

      box.appendChild(
        text
      );

    }

  }


  messagesElement.appendChild(
    box
  );

  messagesElement.scrollTop =
  messagesElement.scrollHeight;

}


// ======================================================
// GUARDAR + MOSTRAR
// ======================================================

async function addRecord(
  record,
  mine = false
){

  if(
    knownMessageIds.has(
      record.id
    )
  ){
    return;
  }


  knownMessageIds.add(
    record.id
  );


  await saveRecord(
    record
  );


  renderRecord(
    record,
    mine
  );

}

    showMessage(
      {
        username:
        data.username
        ||
        peerNames.get(peerId)
        ||
        "Usuario",

        text:
        data.text,

        time:
        data.time
      }
    );

  };


// ======================================
// NOMBRE
// ======================================

  nameAction.onMessage =
  (
    receivedName,
    {
      peerId
    }
  )=>{

    peerNames.set(
      peerId,
      receivedName
    );

  };


// ======================================
// USUARIO ENTRA
// ======================================

  room.onPeerJoin =
  peerId=>{

    updateUsers();


    nameAction.send(
      myName,
      {
        target:
        peerId
      }
    );


    systemMessage(
      "🟢 Un usuario se conectó"
    );

  };


// ======================================
// USUARIO SALE
// ======================================

  room.onPeerLeave =
  peerId=>{

    const name =
    peerNames.get(peerId)
    ||
    "Un usuario";


    peerNames.delete(
      peerId
    );


    updateUsers();


    systemMessage(
      "🔴 "
      +
      name
      +
      " se desconectó"
    );

  };


// ======================================
// UI
// ======================================

  statusElement.textContent =
  "● En línea";


  connectButton.disabled =
  true;

  username.disabled =
  true;

  messageInput.disabled =
  false;

  sendButton.disabled =
  false;


  updateUsers();


  systemMessage(
    "Entraste como "
    +
    myName
  );


  messageInput.focus();

}


// ======================================
// ENVIAR MENSAJE
// ======================================

async function sendMessage(){

  if(!chat){
    return;
  }


  const text =
  messageInput.value.trim();


  if(!text){
    return;
  }


  const peers =
  Object.keys(
    room.getPeers()
  );


  if(
    peers.length === 0
  ){

    systemMessage(
      "No hay otros usuarios conectados."
    );

    return;

  }


  const data = {

    username:
    username.value.trim(),

    text:
    text,

    time:
    getTime()

  };


  try{

    await chat.send(
      data
    );


    showMessage(
      data,
      true
    );


    messageInput.value =
    "";

    messageInput.focus();

  }

  catch(error){

    systemMessage(
      "No se pudo enviar el mensaje."
    );

  }

}


// ======================================
// EVENTOS
// ======================================

connectButton.onclick =
connect;


sendButton.onclick =
sendMessage;


messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
      &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


window.addEventListener(
  "beforeunload",
  ()=>{

    room?.leave();

  }
);

</script>

</body>
</html>
