<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat Global P2P</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:#080d18;
      color:white;
      font-family:Arial,sans-serif;
    }

    .app{
      max-width:900px;
      min-height:100vh;
      margin:auto;
      display:flex;
      flex-direction:column;
      background:#0b1220;
    }

    header{
      padding:15px;
      background:#10192b;
      border-bottom:1px solid #283a5d;
    }

    h1{
      margin:0;
      font-size:22px;
    }

    #status{
      margin-top:6px;
      color:#9cafcc;
      font-size:13px;
    }

    .login{
      display:flex;
      gap:8px;
      padding:12px;
      background:#10192b;
    }

    input,button{
      padding:12px;
      border-radius:10px;
      border:1px solid #30466c;
      font-size:16px;
    }

    input{
      flex:1;
      background:#0c1527;
      color:white;
    }

    button{
      background:#5999ff;
      color:#061020;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.4;
    }

    #peers{
      padding:10px;
      background:#0c1527;
      color:#9cafcc;
      font-size:13px;
    }

    #debug{
      padding:8px 12px;
      background:#050a12;
      color:#7dff9f;
      font-family:monospace;
      font-size:11px;
      max-height:120px;
      overflow:auto;
    }

    #messages{
      flex:1;
      min-height:50vh;
      overflow:auto;
      padding:15px;
    }

    .message{
      max-width:80%;
      padding:10px;
      margin:8px 0;
      border-radius:12px;
      background:#17243d;
      border:1px solid #263d64;
      word-break:break-word;
    }

    .mine{
      margin-left:auto;
      background:#17436e;
    }

    .name{
      color:#80b4ff;
      font-size:12px;
      font-weight:bold;
    }

    .time{
      color:#8394b1;
      font-size:10px;
      margin-left:8px;
    }

    .system{
      text-align:center;
      color:#8394b1;
      font-size:12px;
      margin:10px;
    }

    .composer{
      display:grid;
      grid-template-columns:1fr 90px;
      gap:8px;
      padding:12px;
      background:#10192b;
      border-top:1px solid #283a5d;
    }

    @media(max-width:600px){
      .login{
        flex-direction:column;
      }

      .message{
        max-width:92%;
      }
    }
  </style>
</head>

<body>

<div class="app">

<header>

  <h1>
    🌎 Chat Global P2P
  </h1>

  <div id="status">
    Desconectado
  </div>

</header>


<div class="login">

  <input
    id="username"
    placeholder="Tu nombre"
    maxlength="30"
  >

  <button id="connect">
    Entrar
  </button>

</div>


<div id="peers">
  👥 0 peers conectados
</div>


<div id="debug">
  Sistema iniciado...
</div>


<div id="messages">

  <div class="system">
    Bienvenido al chat global
  </div>

</div>


<div class="composer">

  <input
    id="message"
    placeholder="Mensaje..."
    maxlength="2000"
    disabled
  >

  <button
    id="send"
    disabled
  >
    Enviar
  </button>

</div>

</div>


<script type="module">

// ===========================================
// TRYSTERO
// versión fija para PC y móvil
// ===========================================

import {
  joinRoom,
  selfId
}
from "https://esm.run/trystero@0.25.3";


// ===========================================
// SALA GLOBAL ÚNICA
// ===========================================

const GLOBAL_ROOM =
"TYLERPRO09-GLOBAL-CHAT-V3";

const APP_ID =
"tylerpro09-global-chat-p2p-v3";


// ===========================================
// ELEMENTOS
// ===========================================

const username =
document.getElementById("username");

const connectButton =
document.getElementById("connect");

const messageInput =
document.getElementById("message");

const sendButton =
document.getElementById("send");

const messages =
document.getElementById("messages");

const peersElement =
document.getElementById("peers");

const status =
document.getElementById("status");

const debugElement =
document.getElementById("debug");


// ===========================================
// ESTADO
// ===========================================

let room = null;

let chatAction = null;

let nameAction = null;

const peerNames =
new Map();


// ===========================================
// DEBUG
// ===========================================

function debug(text){

  console.log(text);

  const line =
  document.createElement("div");

  line.textContent =
  new Date().toLocaleTimeString()
  +
  " | "
  +
  text;

  debugElement.appendChild(line);

  debugElement.scrollTop =
  debugElement.scrollHeight;

}


// ===========================================
// NOMBRE
// ===========================================

username.value =
localStorage.getItem(
  "globalUsername"
)
||
"Usuario"
+
Math.floor(
  Math.random() * 10000
);


// ===========================================
// HORA
// ===========================================

function getTime(){

  return new Date()
  .toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


// ===========================================
// SISTEMA
// ===========================================

function systemMessage(text){

  const div =
  document.createElement("div");

  div.className =
  "system";

  div.textContent =
  text;

  messages.appendChild(div);

  messages.scrollTop =
  messages.scrollHeight;

}


// ===========================================
// MENSAJE
// ===========================================

function showMessage(
  data,
  mine = false
){

  const box =
  document.createElement("div");

  box.className =
  "message";

  if(mine){

    box.classList.add(
      "mine"
    );

  }


  const name =
  document.createElement("div");

  name.className =
  "name";

  name.textContent =
  data.username
  ||
  "Usuario";


  const time =
  document.createElement("span");

  time.className =
  "time";

  time.textContent =
  data.time
  ||
  getTime();


  name.appendChild(
    time
  );


  const content =
  document.createElement("div");

  content.textContent =
  data.text;


  box.appendChild(
    name
  );

  box.appendChild(
    content
  );


  messages.appendChild(
    box
  );


  messages.scrollTop =
  messages.scrollHeight;

}


// ===========================================
// PEERS
// ===========================================

function updatePeers(){

  if(!room){

    peersElement.textContent =
    "👥 0 peers conectados";

    return;

  }


  const connected =
  Object.keys(
    room.getPeers()
  );


  peersElement.textContent =
  "👥 "
  +
  connected.length
  +
  " peer"
  +
  (
    connected.length === 1
    ? ""
    : "s"
  )
  +
  " conectados";


  debug(
    "Peers reales: "
    +
    connected.join(", ")
  );

}


// ===========================================
// CONECTAR
// ===========================================

function connect(){

  if(room){

    return;

  }


  const myName =
  username.value.trim();


  if(!myName){

    alert(
      "Escribe tu nombre"
    );

    return;

  }


  localStorage.setItem(
    "globalUsername",
    myName
  );


  status.textContent =
  "🟡 Conectando...";


  debug(
    "Peer local: "
    +
    selfId
  );


  debug(
    "Entrando a sala global..."
  );


  room =
  joinRoom(
    {
      appId:
      APP_ID
    },

    GLOBAL_ROOM,

    {
      onJoinError(details){

        debug(
          "ERROR conexión: "
          +
          (
            details?.error?.message
            ||
            details?.error
            ||
            "desconocido"
          )
        );

        console.error(
          details
        );

      }
    }
  );


  // =====================================
  // ACCIONES
  // =====================================

  chatAction =
  room.makeAction(
    "chat-message"
  );


  nameAction =
  room.makeAction(
    "peer-name"
  );


  // =====================================
  // MENSAJES RECIBIDOS
  // =====================================

  chatAction.onMessage =
  (
    data,
    {
      peerId
    }
  )=>{

    debug(
      "Mensaje recibido de "
      +
      peerId
    );


    console.log(
      "DATA RECIBIDA",
      data
    );


    showMessage(
      {
        username:
        data.username
        ||
        peerNames.get(peerId)
        ||
        "Usuario",

        text:
        data.text,

        time:
        data.time
      }
    );

  };


  // =====================================
  // NOMBRE RECIBIDO
  // =====================================

  nameAction.onMessage =
  (
    receivedName,
    {
      peerId
    }
  )=>{

    peerNames.set(
      peerId,
      receivedName
    );


    debug(
      "Nombre recibido: "
      +
      receivedName
    );

  };


  // =====================================
  // PEER CONECTADO
  // =====================================

  room.onPeerJoin =
  peerId=>{

    debug(
      "PEER CONECTADO: "
      +
      peerId
    );


    systemMessage(
      "🟢 Usuario conectado"
    );


    updatePeers();


    nameAction.send(
      myName,
      {
        target:
        peerId
      }
    );


    // mensaje automático de prueba

    chatAction.send(
      {
        username:
        myName,

        text:
        "✅ Conexión P2P establecida",

        time:
        getTime()
      },

      {
        target:
        peerId
      }
    );

  };


  // =====================================
  // PEER DESCONECTADO
  // =====================================

  room.onPeerLeave =
  peerId=>{

    debug(
      "PEER DESCONECTADO: "
      +
      peerId
    );


    peerNames.delete(
      peerId
    );


    updatePeers();


    systemMessage(
      "🔴 Usuario desconectado"
    );

  };


  // =====================================
  // UI
  // =====================================

  status.innerHTML =
  "🟢 Dentro del chat global"
  +
  "<br>"
  +
  "ID: "
  +
  selfId;


  connectButton.disabled =
  true;

  username.disabled =
  true;

  messageInput.disabled =
  false;

  sendButton.disabled =
  false;


  systemMessage(
    "🌎 Entraste como "
    +
    myName
  );


  updatePeers();


  messageInput.focus();

}


// ===========================================
// ENVIAR
// ===========================================

async function sendMessage(){

  if(!chatAction){

    return;

  }


  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  const currentPeers =
  Object.keys(
    room.getPeers()
  );


  debug(
    "Enviando a "
    +
    currentPeers.length
    +
    " peers"
  );


  if(
    currentPeers.length === 0
  ){

    systemMessage(
      "⚠️ No hay conexión P2P con otro dispositivo"
    );

    return;

  }


  const data = {

    username:
    username.value.trim(),

    text:
    text,

    time:
    getTime()

  };


  try{

    await chatAction.send(
      data
    );


    debug(
      "Mensaje enviado correctamente"
    );


    showMessage(
      data,
      true
    );


    messageInput.value =
    "";

  }
  catch(error){

    debug(
      "ERROR enviando: "
      +
      error.message
    );

  }

}


// ===========================================
// BOTONES
// ===========================================

connectButton.addEventListener(
  "click",
  connect
);


sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


// ===========================================
// SALIR
// ===========================================

window.addEventListener(
  "beforeunload",
  ()=>{

    room?.leave();

  }
);

</script>

</body>
</html>
