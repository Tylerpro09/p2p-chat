<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat Global P2P</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:#080d18;
      color:white;
      font-family:Arial,sans-serif;
    }

    .app{
      width:min(900px,100%);
      min-height:100vh;
      margin:auto;
      display:flex;
      flex-direction:column;
      background:#0b1220;
    }

    header{
      background:#10192b;
      padding:15px;
      border-bottom:1px solid #283a5d;
    }

    h1{
      margin:0;
      font-size:22px;
    }

    #status{
      margin-top:6px;
      color:#9cafcc;
      font-size:13px;
      word-break:break-all;
    }

    .login{
      display:flex;
      gap:8px;
      padding:12px;
      background:#10192b;
    }

    input,
    button{
      border-radius:10px;
      border:1px solid #30466c;
      padding:12px;
      font-size:16px;
    }

    input{
      flex:1;
      background:#0c1527;
      color:white;
      outline:none;
    }

    button{
      background:#5999ff;
      color:#061020;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    #peers{
      padding:9px 12px;
      background:#0c1527;
      color:#9cafcc;
      font-size:12px;
      border-bottom:1px solid #203252;
    }

    #messages{
      flex:1;
      min-height:60vh;
      overflow-y:auto;
      padding:15px;
    }

    .message{
      max-width:80%;
      background:#17243d;
      border:1px solid #263d64;
      border-radius:12px;
      padding:10px;
      margin-bottom:10px;
      word-break:break-word;
    }

    .message.mine{
      margin-left:auto;
      background:#17436e;
    }

    .username{
      color:#80b4ff;
      font-size:12px;
      font-weight:bold;
      margin-bottom:4px;
    }

    .time{
      color:#8497b7;
      font-size:10px;
      margin-left:7px;
      font-weight:normal;
    }

    .system{
      color:#8394b1;
      text-align:center;
      font-size:12px;
      margin:10px;
    }

    .composer{
      display:grid;
      grid-template-columns:1fr 100px;
      gap:8px;
      padding:12px;
      background:#10192b;
      border-top:1px solid #283a5d;
      position:sticky;
      bottom:0;
    }

    @media(max-width:600px){

      .message{
        max-width:92%;
      }

      .composer{
        grid-template-columns:1fr 85px;
      }

      .login{
        flex-direction:column;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <h1>🌎 Chat Global P2P</h1>

    <div id="status">
      Desconectado
    </div>

  </header>


  <div class="login">

    <input
      id="username"
      maxlength="30"
      placeholder="Escribe tu nombre"
    >

    <button id="connect">
      Entrar
    </button>

  </div>


  <div id="peers">
    👥 0 usuarios conectados
  </div>


  <div id="messages">

    <div class="system">
      Bienvenido al chat global.
    </div>

  </div>


  <div class="composer">

    <input
      id="message"
      maxlength="2000"
      placeholder="Escribe un mensaje..."
      disabled
    >

    <button
      id="send"
      disabled
    >
      Enviar
    </button>

  </div>

</div>


<script type="module">

import {
  joinRoom,
  selfId
}
from "https://esm.run/trystero";


// =========================================
// ÚNICA SALA GLOBAL
// =========================================

const GLOBAL_ROOM =
"TYLERPRO09-GLOBAL-CHAT-ONLY-ONE";


// Todos deben usar también el mismo appId.

const APP_ID =
"tylerpro09-global-p2p-chat-v2";


// =========================================
// ELEMENTOS
// =========================================

const usernameInput =
document.getElementById(
  "username"
);


const messageInput =
document.getElementById(
  "message"
);


const connectButton =
document.getElementById(
  "connect"
);


const sendButton =
document.getElementById(
  "send"
);


const messagesElement =
document.getElementById(
  "messages"
);


const peersElement =
document.getElementById(
  "peers"
);


const statusElement =
document.getElementById(
  "status"
);


// =========================================
// ESTADO
// =========================================

let room = null;

let sendChat = null;

let sendUsername = null;

const peers =
new Map();


// =========================================
// NOMBRE GUARDADO
// =========================================

usernameInput.value =
localStorage.getItem(
  "global-chat-name"
)
||
"Usuario"
+
Math.floor(
  Math.random() * 9999
);


// =========================================
// HORA
// =========================================

function currentTime(){

  return new Date()
  .toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


// =========================================
// MENSAJE DEL SISTEMA
// =========================================

function addSystem(
  text
){

  const div =
  document.createElement(
    "div"
  );

  div.className =
  "system";

  div.textContent =
  text;

  messagesElement.appendChild(
    div
  );

  messagesElement.scrollTop =
  messagesElement.scrollHeight;

}


// =========================================
// MENSAJE NORMAL
// =========================================

function addMessage(
  data,
  mine = false
){

  const container =
  document.createElement(
    "div"
  );


  container.className =
  "message";


  if(mine){

    container.classList.add(
      "mine"
    );

  }


  const username =
  document.createElement(
    "div"
  );


  username.className =
  "username";


  username.textContent =
  data.username
  ||
  "Anónimo";


  const time =
  document.createElement(
    "span"
  );


  time.className =
  "time";


  time.textContent =
  data.time
  ||
  currentTime();


  username.appendChild(
    time
  );


  const body =
  document.createElement(
    "div"
  );


  body.textContent =
  data.text
  ||
  "";


  container.appendChild(
    username
  );


  container.appendChild(
    body
  );


  messagesElement.appendChild(
    container
  );


  messagesElement.scrollTop =
  messagesElement.scrollHeight;

}


// =========================================
// CONTADOR DE USUARIOS
// =========================================

function updatePeers(){

  const total =
  peers.size + 1;


  peersElement.textContent =
  "👥 "
  +
  total
  +
  " usuario"
  +
  (
    total === 1
    ? ""
    : "s"
  )
  +
  " conectado"
  +
  (
    total === 1
    ? ""
    : "s"
  );

}


// =========================================
// CONECTAR
// =========================================

function connect(){

  if(room){

    return;

  }


  const username =
  usernameInput.value.trim();


  if(!username){

    alert(
      "Escribe tu nombre."
    );

    return;

  }


  localStorage.setItem(
    "global-chat-name",
    username
  );


  statusElement.textContent =
  "🟡 Conectando al chat global...";


  // =====================================
  // TODOS ENTRAN OBLIGATORIAMENTE
  // A LA MISMA SALA
  // =====================================

  room =
  joinRoom(
    {
      appId:
      APP_ID
    },
    GLOBAL_ROOM
  );


  // =====================================
  // ACCIONES P2P
  // =====================================

  sendChat =
  room.makeAction(
    "global-message"
  );


  sendUsername =
  room.makeAction(
    "global-username"
  );


  // =====================================
  // RECIBIR MENSAJE
  // =====================================

  sendChat.onMessage =
  (
    data,
    meta
  )=>{

    const peerId =
    meta.peerId;


    const username =
    data?.username
    ||
    peers.get(peerId)
    ||
    "Usuario";


    const text =
    data?.text
    ||
    "";


    if(!text){

      return;

    }


    addMessage(
      {
        username:
        username,

        text:
        text,

        time:
        data?.time
        ||
        currentTime()
      }
    );

  };


  // =====================================
  // RECIBIR NOMBRE
  // =====================================

  sendUsername.onMessage =
  (
    name,
    meta
  )=>{

    peers.set(
      meta.peerId,
      String(name)
    );


    updatePeers();

  };


  // =====================================
  // PEER ENTRA
  // =====================================

  room.onPeerJoin =
  peerId=>{

    peers.set(
      peerId,
      "Usuario"
    );


    updatePeers();


    addSystem(
      "🟢 Nuevo usuario conectado"
    );


    sendUsername.send(
      username,
      {
        target:
        peerId
      }
    );

  };


  // =====================================
  // PEER SALE
  // =====================================

  room.onPeerLeave =
  peerId=>{

    const name =
    peers.get(peerId)
    ||
    "Usuario";


    peers.delete(
      peerId
    );


    updatePeers();


    addSystem(
      "🔴 "
      +
      name
      +
      " se desconectó"
    );

  };


  // =====================================
  // UI
  // =====================================

  statusElement.innerHTML =
  "🟢 Conectado al chat global"
  +
  "<br>"
  +
  "Peer ID: "
  +
  selfId;


  connectButton.disabled =
  true;


  usernameInput.disabled =
  true;


  messageInput.disabled =
  false;


  sendButton.disabled =
  false;


  updatePeers();


  addSystem(
    "🌎 Entraste al chat global como "
    +
    username
  );


  messageInput.focus();

}


// =========================================
// ENVIAR MENSAJE
// =========================================

function sendMessage(){

  if(!sendChat){

    return;

  }


  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  const data = {

    username:
    usernameInput.value.trim(),

    text:
    text,

    time:
    currentTime()

  };


  sendChat.send(
    data
  );


  addMessage(
    data,
    true
  );


  messageInput.value =
  "";


  messageInput.focus();

}


// =========================================
// EVENTOS
// =========================================

connectButton.onclick =
connect;


sendButton.onclick =
sendMessage;


messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
      &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


// =========================================
// CERRAR CONEXIÓN
// =========================================

window.addEventListener(
  "beforeunload",
  ()=>{

    if(room){

      room.leave();

    }

  }
);

</script>

</body>
</html>
