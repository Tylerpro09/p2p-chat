
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Global</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:#101827;
}

header{
  padding:15px;
  background:#182235;
  border-bottom:1px solid #2c3b58;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.online{
  font-size:13px;
  color:#7fdc9c;
}

.login{
  display:flex;
  gap:8px;
  padding:12px;
  background:#141e30;
}

input,
button{
  padding:12px;
  border-radius:10px;
  border:1px solid #32435f;
  font-size:16px;
}

input{
  flex:1;
  background:#0f1726;
  color:white;
  outline:none;
}

button{
  background:#4f8df7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
}

#users{
  padding:8px 12px;
  background:#121b2b;
  color:#9cafcc;
  font-size:12px;
  border-bottom:1px solid #263653;
}

#messages{
  flex:1;
  min-height:60vh;
  overflow:auto;
  padding:15px;
}

.message{
  max-width:80%;
  margin:8px 0;
  padding:10px 12px;
  border-radius:14px;
  background:#1a2840;
  border:1px solid #2a3b5b;
  word-break:break-word;
}

.message.mine{
  margin-left:auto;
  background:#24518b;
}

.name{
  color:#8ab9ff;
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}

.time{
  color:#8394b1;
  font-size:10px;
  margin-left:7px;
  font-weight:normal;
}

.system{
  text-align:center;
  color:#7e8fa9;
  font-size:12px;
  margin:10px;
}

.composer{
  display:grid;
  grid-template-columns:1fr 90px;
  gap:8px;
  padding:12px;
  background:#141e30;
  border-top:1px solid #2c3b58;
  position:sticky;
  bottom:0;
}

@media(max-width:600px){
  .login{
    flex-direction:column;
  }

  .message{
    max-width:92%;
  }

  .composer{
    grid-template-columns:1fr 80px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="title">🌎 Chat Global</div>
  <div id="status" class="online">Desconectado</div>
</header>

<div class="login">
  <input
    id="username"
    maxlength="30"
    placeholder="Tu nombre"
  >

  <button id="connect">
    Entrar
  </button>
</div>

<div id="users">
  👥 1 usuario conectado
</div>

<div id="messages">
  <div class="system">
    Bienvenido al chat global.
  </div>
</div>

<div class="composer">

  <input
    id="message"
    maxlength="2000"
    placeholder="Escribe un mensaje..."
    disabled
  >

  <button
    id="send"
    disabled
  >
    Enviar
  </button>

</div>

</div>

<script type="module">

import {
  joinRoom
}
from "https://esm.run/trystero@0.25.3";


// ======================================
// CONFIGURACIÓN INTERNA
// ======================================

const GLOBAL_ROOM =
"TYLERPRO09-GLOBAL-CHAT-V4";

const APP_ID =
"tylerpro09-global-chat-v4";

const RELAYS = [
  "wss://relay.damus.io",
  "wss://relay.nostr.band",
  "wss://nos.lol",
  "wss://nostr.wine"
];


// ======================================
// ELEMENTOS
// ======================================

const username =
document.getElementById("username");

const connectButton =
document.getElementById("connect");

const messageInput =
document.getElementById("message");

const sendButton =
document.getElementById("send");

const messages =
document.getElementById("messages");

const usersElement =
document.getElementById("users");

const statusElement =
document.getElementById("status");


// ======================================
// VARIABLES
// ======================================

let room = null;

let chat = null;

let nameAction = null;

const peerNames =
new Map();


// ======================================
// NOMBRE
// ======================================

username.value =
localStorage.getItem("chat-name")
||
"Usuario"
+
Math.floor(
  Math.random() * 9999
);


// ======================================
// HORA
// ======================================

function getTime(){

  return new Date()
  .toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


// ======================================
// MENSAJE DEL SISTEMA
// ======================================

function systemMessage(text){

  const div =
  document.createElement("div");

  div.className =
  "system";

  div.textContent =
  text;

  messages.appendChild(div);

  messages.scrollTop =
  messages.scrollHeight;

}


// ======================================
// MOSTRAR MENSAJE
// ======================================

function showMessage(
  data,
  mine = false
){

  const box =
  document.createElement("div");

  box.className =
  "message";

  if(mine){
    box.classList.add("mine");
  }


  const name =
  document.createElement("div");

  name.className =
  "name";

  name.textContent =
  data.username
  ||
  "Usuario";


  const time =
  document.createElement("span");

  time.className =
  "time";

  time.textContent =
  data.time
  ||
  getTime();


  name.appendChild(time);


  const text =
  document.createElement("div");

  text.textContent =
  data.text;


  box.appendChild(name);

  box.appendChild(text);

  messages.appendChild(box);

  messages.scrollTop =
  messages.scrollHeight;

}


// ======================================
// CONTADOR
// ======================================

function updateUsers(){

  if(!room){
    usersElement.textContent =
    "👥 1 usuario conectado";
    return;
  }


  const peers =
  Object.keys(
    room.getPeers()
  );


  const total =
  peers.length + 1;


  usersElement.textContent =
  "👥 "
  +
  total
  +
  " usuario"
  +
  (
    total === 1
    ? ""
    : "s"
  )
  +
  " conectado"
  +
  (
    total === 1
    ? ""
    : "s"
  );

}


// ======================================
// CONECTAR
// ======================================

function connect(){

  if(room){
    return;
  }


  const myName =
  username.value.trim();


  if(!myName){

    alert(
      "Escribe tu nombre"
    );

    return;

  }


  localStorage.setItem(
    "chat-name",
    myName
  );


  statusElement.textContent =
  "Conectando...";


  room =
  joinRoom(
    {
      appId:
      APP_ID,

      relayConfig:{
        urls:
        RELAYS,

        warnOnRelayFailure:
        false
      }
    },

    GLOBAL_ROOM
  );


  chat =
  room.makeAction(
    "chat"
  );


  nameAction =
  room.makeAction(
    "username"
  );


// ======================================
// RECIBIR MENSAJE
// ======================================

  chat.onMessage =
  (
    data,
    {
      peerId
    }
  )=>{

    showMessage(
      {
        username:
        data.username
        ||
        peerNames.get(peerId)
        ||
        "Usuario",

        text:
        data.text,

        time:
        data.time
      }
    );

  };


// ======================================
// NOMBRE
// ======================================

  nameAction.onMessage =
  (
    receivedName,
    {
      peerId
    }
  )=>{

    peerNames.set(
      peerId,
      receivedName
    );

  };


// ======================================
// USUARIO ENTRA
// ======================================

  room.onPeerJoin =
  peerId=>{

    updateUsers();


    nameAction.send(
      myName,
      {
        target:
        peerId
      }
    );


    systemMessage(
      "🟢 Un usuario se conectó"
    );

  };


// ======================================
// USUARIO SALE
// ======================================

  room.onPeerLeave =
  peerId=>{

    const name =
    peerNames.get(peerId)
    ||
    "Un usuario";


    peerNames.delete(
      peerId
    );


    updateUsers();


    systemMessage(
      "🔴 "
      +
      name
      +
      " se desconectó"
    );

  };


// ======================================
// UI
// ======================================

  statusElement.textContent =
  "● En línea";


  connectButton.disabled =
  true;

  username.disabled =
  true;

  messageInput.disabled =
  false;

  sendButton.disabled =
  false;


  updateUsers();


  systemMessage(
    "Entraste como "
    +
    myName
  );


  messageInput.focus();

}


// ======================================
// ENVIAR MENSAJE
// ======================================

async function sendMessage(){

  if(!chat){
    return;
  }


  const text =
  messageInput.value.trim();


  if(!text){
    return;
  }


  const peers =
  Object.keys(
    room.getPeers()
  );


  if(
    peers.length === 0
  ){

    systemMessage(
      "No hay otros usuarios conectados."
    );

    return;

  }


  const data = {

    username:
    username.value.trim(),

    text:
    text,

    time:
    getTime()

  };


  try{

    await chat.send(
      data
    );


    showMessage(
      data,
      true
    );


    messageInput.value =
    "";

    messageInput.focus();

  }

  catch(error){

    systemMessage(
      "No se pudo enviar el mensaje."
    );

  }

}


// ======================================
// EVENTOS
// ======================================

connectButton.onclick =
connect;


sendButton.onclick =
sendMessage;


messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
      &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


window.addEventListener(
  "beforeunload",
  ()=>{

    room?.leave();

  }
);

</script>

</body>
</html>
