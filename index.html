<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Global Chat</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="registerOverlay" class="overlay">
    <div class="registerCard">
      <div class="registerLogo">💬</div>
      <h2>Elige tu nombre</h2>
      <p>Solo tendrás que hacerlo una vez en este dispositivo. Después entrarás automáticamente al chat.</p>
      <input id="registerName" class="registerInput" maxlength="30" autocomplete="off" placeholder="Ej. Tyler">
      <button id="registerButton" class="registerButton">Continuar</button>
    </div>
  </div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brandIcon">💬</div>
        <div class="brandText">
          <div class="title">Global Chat</div>
          <div class="subtitle">Conversación global</div>
        </div>
      </div>
      <div class="headerRight">
        <div id="status" class="status online">
          <span class="statusDot"></span>
          <span id="statusText">En línea</span>
        </div>
        <div id="avatar" class="avatar" title="Cambiar nombre">U</div>
      </div>
    </header>

    <div class="userBar">
      <div>Conectado como <strong id="currentUser">Usuario</strong></div>
      <div id="users" class="userCount">👥 1 usuario</div>
    </div>

    <main id="messages" class="messages"></main>

    <div id="preview" class="preview">
      <div class="previewCard">
        <div id="previewMedia" class="previewMedia"></div>
        <div class="previewInfo">
          <div id="previewName" class="previewName"></div>
          <div id="previewSize" class="previewSize"></div>
        </div>
        <button id="cancelFile" class="removeFile">✕</button>
      </div>
    </div>

    <div class="composer">
      <button id="attach" class="iconButton" title="Adjuntar archivo">＋</button>
      <input id="message" class="messageInput" maxlength="2000" placeholder="Escribe un mensaje...">
      <button id="send" class="sendButton" title="Enviar">➤</button>
    </div>

    <input id="fileInput" type="file" accept="image/*,video/*">
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
